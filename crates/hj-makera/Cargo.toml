[package]
name = "hj-makera"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
md-5 = "0.11.0"
nusb = { version = "0.2.9", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
