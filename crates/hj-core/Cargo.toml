[package]
name = "hj-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
hj-makera = { version = "0.1.0", path = "../hj-makera" }
hj-sim = { version = "0.1.0", path = "../hj-sim" }
json-patch = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
